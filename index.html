<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드론비행규제가이드 · 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --sky:#0284C7; --sky-50:#F0F9FF; --sky-100:#E0F2FE;
  --navy:#0F172A; --navy2:#1E293B;
  --green:#10B981; --green-d:#059669; --green-50:#ECFDF5;
  --amber:#F59E0B; --amber-d:#B45309; --amber-50:#FFFBEB;
  --red:#EF4444; --red-d:#DC2626; --red-50:#FEF2F2;
  --bg:#F8FAFC; --white:#fff; --border:#E2E8F0; --muted:#64748B; --text:#1E293B;
  --r:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--sky);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
h1,h2,h3{margin:0;color:var(--navy);line-height:1.3}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 120px}
.muted{color:var(--muted)} .cap{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
@media(min-width:900px){.card{padding:24px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--border);background:var(--white);color:var(--navy2);font-weight:600;font-size:14.5px;transition:.15s}
.btn:hover{background:#F1F5F9}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.primary:hover{background:#0369A1}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.lg{min-height:56px;font-size:17px;padding:0 28px;border-radius:14px}
.btn.block{width:100%}
.btn.danger{color:var(--red-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green-50);color:var(--green-d);border:1px solid #A7F3D0}
.b-amber{background:var(--amber-50);color:var(--amber-d);border:1px solid #FDE68A}
.b-red{background:var(--red-50);color:var(--red-d);border:1px solid #FECACA}
.b-blue{background:var(--sky-50);color:var(--sky);border:1px solid #BAE6FD}
.b-gray{background:#F1F5F9;color:#475569;border:1px solid var(--border)}

/* header */
header.gnb{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff}
.gnb-in{max-width:1200px;margin:0 auto;height:60px;display:flex;align-items:center;gap:20px;padding:0 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:#fff;font-size:17px;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--sky);display:grid;place-items:center}
.nav{display:none;gap:4px;flex:1}
.nav a{color:#CBD5E1;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14.5px}
.nav a.on,.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.gnb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.gnb-right .btn{min-height:36px;background:transparent;color:#E2E8F0;border-color:rgba(255,255,255,.2);font-size:13.5px}
@media(min-width:900px){.nav{display:flex}}
@media(max-width:899px){.gnb-right [data-act=logout]{display:none}.gnb-right .btn{white-space:nowrap}.hero .btn.lg{width:100%;font-size:15.5px;min-height:52px;padding:0 14px}}

/* bottom nav (mobile) */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11.5px;color:var(--muted);font-weight:600}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--sky)}
@media(min-width:900px){.tabbar{display:none}.wrap{padding-bottom:60px}}

/* hero */
.hero{background:linear-gradient(135deg,#0F172A 0%,#0C4A6E 60%,#0284C7 100%);color:#fff;border-radius:20px;padding:32px 20px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:28px;letter-spacing:-.02em}
.hero p{color:#BAE6FD;margin:10px 0 22px}
@media(min-width:900px){.hero{padding:48px 44px}.hero h1{font-size:38px}}
.hero-deco{position:absolute;right:-40px;top:-30px;opacity:.12;width:320px}
.search{display:flex;gap:8px;background:#fff;border-radius:14px;padding:6px;max-width:620px}
.search input{flex:1;border:0;outline:0;padding:0 10px;min-width:0;color:var(--text)}
.field{width:100%;min-height:46px;border:1px solid var(--border);border-radius:12px;padding:0 14px;background:#fff;color:var(--text);outline:none}
.field:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-100)}
label.lbl{display:block;font-weight:600;font-size:13.5px;margin:0 0 6px;color:var(--navy2)}

/* weather */
.wx{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:900px){.wx{grid-template-columns:repeat(5,1fr)}}
.wx-item{background:var(--bg);border-radius:12px;padding:12px 14px}
.wx-item b{display:block;font-size:19px;color:var(--navy)}

/* wizard */
.progress{display:flex;gap:8px;margin:6px 0 22px}
.progress .st{flex:1}
.progress .bar{height:6px;border-radius:9px;background:var(--border)}
.progress .st.on .bar{background:var(--sky)}
.progress .st span{font-size:12.5px;font-weight:600;color:var(--muted)}
.progress .st.on span{color:var(--sky)}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:640px){.opts.c2{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}}
.opt{border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%}
.opt:hover{border-color:#94A3B8}
.opt.on{border-color:var(--sky);background:var(--sky-50);box-shadow:0 0 0 3px var(--sky-100)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid #CBD5E1;flex:none;margin-top:2px}
.opt.on .dot{border:5px solid var(--sky)}
.opt b{display:block;color:var(--navy)}
.opt small{color:var(--muted)}
.toggle{display:inline-flex;background:#F1F5F9;border-radius:12px;padding:4px}
.toggle button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted);min-height:38px}
.toggle button.on{background:#fff;color:var(--sky);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--navy2);min-height:36px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec-t{font-size:17px;font-weight:700;margin:0 0 4px}
.err{background:var(--red-50);color:var(--red-d);padding:10px 14px;border-radius:10px;font-size:13.5px;margin-top:8px}
.notice-empty{background:var(--sky-50);border:1px dashed #7DD3FC;border-radius:12px;padding:14px;font-size:14px}

/* map */
.map{position:relative;background:#EEF2EA;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.map svg{display:block;width:100%;height:100%;cursor:crosshair}
.map .zone{cursor:pointer;transition:opacity .15s}
.map .zone:hover{opacity:.8}
.map-chips{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.map-chips .chip{box-shadow:var(--shadow);font-size:12.5px;min-height:32px;padding:4px 11px}
.map-chips .chip.off{opacity:.55;text-decoration:line-through}
.legend{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 10px;font-size:11.5px;box-shadow:var(--shadow);z-index:2}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.zoom{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;z-index:2;box-shadow:var(--shadow);border-radius:10px;overflow:hidden}
.zoom button{width:34px;height:34px;border:0;background:#fff;font-weight:700;border-bottom:1px solid var(--border)}
.popup{position:absolute;z-index:3;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:12px 14px;font-size:13px;min-width:210px;transform:translate(-50%,calc(-100% - 12px))}
.popup b{font-size:14px;color:var(--navy)}
.popup .x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--muted);font-size:16px}
.map-loading{position:absolute;inset:0;background:rgba(248,250,252,.7);display:grid;place-items:center;z-index:4;font-weight:600;color:var(--sky);font-size:14px}
.pbar{position:absolute;top:0;left:0;height:3px;background:var(--sky);animation:load 1s ease forwards;z-index:5}
@keyframes load{from{width:0}to{width:100%}}

/* result */
.split{display:grid;gap:16px}
@media(min-width:1024px){.split{grid-template-columns:3fr 2fr;align-items:start}.split .map{position:sticky;top:76px;height:calc(100vh - 100px)}}
.res-map{height:48vh;min-height:300px}
.status{border-radius:var(--r);padding:18px 20px;color:#fff}
.status.g{background:linear-gradient(135deg,#059669,#10B981)}
.status.a{background:linear-gradient(135deg,#D97706,#F59E0B)}
.status.r{background:linear-gradient(135deg,#B91C1C,#EF4444)}
.status h2{color:#fff;font-size:21px;margin:4px 0}
.status .meta{font-size:13px;opacity:.92}
.rc{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--border)}
.rc:first-child{border-top:0;padding-top:0}
.rc .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800}
.ic.g{background:var(--green-50);color:var(--green-d)}
.ic.a{background:var(--amber-50);color:var(--amber-d)}
.ic.r{background:var(--red-50);color:var(--red-d)}
.rc h3{font-size:15.5px;margin-bottom:2px}
.rc ul{margin:4px 0 0;padding-left:18px;font-size:14px;color:#334155}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--sky)}
.apps{display:grid;gap:8px}
.app-link{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff;font-weight:600;color:var(--navy2);width:100%;text-align:left}
.app-link:hover{border-color:var(--sky);color:var(--sky)}

/* overlay / modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.modal.wide{max-width:880px;background:#E2E8F0;padding:16px}
.spinner{width:42px;height:42px;border:4px solid var(--sky-100);border-top-color:var(--sky);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* A4 report */
.a4{background:#fff;width:100%;max-width:794px;aspect-ratio:210/297;margin:0 auto;padding:44px 48px;font-size:12.5px;color:#111;box-shadow:0 4px 18px rgba(0,0,0,.12);overflow:hidden}
.a4 h1{text-align:center;font-size:21px;border-top:3px double #111;border-bottom:3px double #111;padding:12px 0;margin:14px 0 18px;color:#111}
.a4 h4{margin:18px 0 8px;font-size:14px}
.a4 table{width:100%;border-collapse:collapse}
.a4 td{border:1px solid #94A3B8;padding:6px 8px}
.a4 td.k{background:#F1F5F9;font-weight:600;width:18%}
.a4 .foot{border-top:1px solid #94A3B8;margin-top:22px;padding-top:10px;font-size:11px;color:#475569}
@media(max-width:640px){.a4{padding:20px;font-size:10px;aspect-ratio:auto}}
@media print{
  body *{visibility:hidden}
  #report,#report *{visibility:visible}
  #report{position:fixed;left:0;top:0;width:210mm;height:297mm;box-shadow:none;max-width:none}
  @page{size:A4;margin:0}
}

/* notices */
.tabs{display:flex;gap:4px;background:#F1F5F9;padding:4px;border-radius:12px;width:max-content;max-width:100%}
.tabs a{padding:8px 18px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14.5px}
.tabs a.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.ntc{border:1px solid var(--border);border-radius:var(--r);background:#fff;overflow:hidden}
.ntc-h{padding:16px 18px;cursor:pointer;display:block;width:100%;text-align:left;border:0;background:none}
.ntc-h h3{font-size:16px;margin:6px 0 4px}
.ntc-b{border-top:1px solid var(--border);padding:16px 18px;max-width:100%;overflow-x:auto;font-size:14.5px}
.ntc-b table{border-collapse:collapse;min-width:420px;font-size:13.5px}
.ntc-b td,.ntc-b th{border:1px solid var(--border);padding:6px 10px;text-align:left}
.ntc-b th{background:var(--bg)}
.lic{border:1.5px solid var(--border);border-radius:var(--r);background:#fff;padding:18px;position:relative}
.lic.mine{border:2.5px solid var(--sky);box-shadow:0 0 0 4px var(--sky-100)}
.lic h3{font-size:18px}
.lic ul{padding-left:18px;margin:10px 0;font-size:14px}
.lic-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.lic-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.lic-grid{grid-template-columns:repeat(5,1fr)}}
.steps{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:900px){.steps{grid-template-columns:repeat(4,1fr)}}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;margin-bottom:6px}

/* mypage */
.drone{display:flex;flex-direction:column;gap:8px}
.drone dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0;font-size:14px}
.drone dt{color:var(--muted)}
.drone dd{margin:0;font-weight:600}
.hist{display:grid;gap:8px}
.hist-row{display:grid;grid-template-columns:1fr;gap:6px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff}
@media(min-width:900px){.hist-row{grid-template-columns:100px 1.4fr 1fr 150px auto}}

/* chatbot */
.fab{position:fixed;right:18px;bottom:84px;z-index:50;width:58px;height:58px;border-radius:50%;border:0;background:var(--sky);color:#fff;box-shadow:0 8px 20px rgba(2,132,199,.4);display:grid;place-items:center}
@media(min-width:900px){.fab{bottom:28px;right:28px}}
.drawer{position:fixed;z-index:70;background:#fff;display:flex;flex-direction:column;inset:0;transform:translateX(100%);transition:transform .25s}
@media(min-width:900px){.drawer{left:auto;width:420px;border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(15,23,42,.12)}}
.drawer.open{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--navy);color:#fff}
.dr-h b{flex:1}
.dr-h button{background:none;border:0;color:#fff;font-size:20px}
.dr-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:14.5px;white-space:pre-wrap}
.msg.ai{background:#fff;border:1px solid var(--border);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:var(--sky);color:#fff;align-self:flex-end;border-top-right-radius:4px}
.src{margin-top:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:13px;white-space:normal}
.src summary{padding:8px 10px;cursor:pointer;font-weight:700;color:var(--navy2)}
.src div{padding:0 10px 10px}
.src q{display:block;color:#475569;margin:4px 0 8px;font-style:normal;border-left:3px solid var(--sky);padding-left:8px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#94A3B8;margin:0 2px;animation:bounce 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.dr-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#fff}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:90;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
footer{border-top:1px solid var(--border);margin-top:40px;padding:20px 0;font-size:12.5px;color:var(--muted)}
.proto-tag{position:fixed;left:12px;bottom:12px;z-index:30;font-size:11px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;border-radius:8px;padding:2px 8px;font-weight:700}
@media(max-width:899px){.proto-tag{display:none}}
</style>
</head>
<body>

<header class="gnb">
  <div class="gnb-in">
    <a class="logo" href="#/home"><span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg></span>드론비행규제가이드</a>
    <nav class="nav" id="nav"></nav>
    <div class="gnb-right" id="gnbRight"></div>
  </div>
</header>
<div class="proto-tag">PROTOTYPE · 목 데이터</div>

<main id="app"></main>

<nav class="tabbar" id="tabbar"></nav>

<button class="fab" data-act="chat-open" aria-label="AI 법령 챗봇 열기">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke-width="3" stroke-linecap="round"/></svg>
</button>

<aside class="drawer" id="drawer" aria-label="AI 법령 질의응답 챗봇">
  <div class="dr-h"><span>🤖</span><b>AI 항공안전법·드론 규제 상담</b><button data-act="chat-close" aria-label="닫기">×</button></div>
  <div class="dr-body" id="chatBody"></div>
  <form class="dr-f" id="chatForm">
    <input class="field" id="chatInput" placeholder="궁금한 드론 법령/규제를 입력하세요..." autocomplete="off">
    <button class="btn primary" type="submit">전송</button>
  </form>
</aside>

<div id="layer"></div>

<script>
/* ============================================================
   MOCK DATA
   ============================================================ */
const WC = [
  {label:'250g 이하', sub:'자격·기체신고 면제', lic:'면제', licDesc:'자격 불필요', reg:'면제', max:0.25},
  {label:'250g 초과 ~ 2kg', sub:'4종 자격 대상', lic:'4종', licDesc:'온라인 무료 교육 이수', reg:'면제 (영리 목적 시 신고 필수)', max:2},

function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function zonesAt(x,y){return ZONES.filter(z=>z.shape==='circle'?Math.hypot(x-z.cx,y-z.cy)<=z.r:inPoly(x,y,z.pts))}

function diagnose(w){
  const wc=WC[w.wc], zs=zonesAt(w.place.x,w.place.y);
  const P=zs.find(z=>z.type==='PROHIBITED'), R=zs.find(z=>z.type==='RESTRICTED'), C=zs.find(z=>z.type==='CONTROL');
  const cards=[], docs=[], apps=[];
  const addDoc=d=>{if(!docs.includes(d))docs.push(d)};
  // 1. 공역/비행승인
  if(P){cards.push({lv:2,t:'공역 및 비행승인',h:'비행금지구역 — 비행승인 필수',l:[`해당 구역: ${P.code} ${P.name}`,`관할: ${P.auth}`,'원칙적 금지 · 예외적 승인 시에만 비행 가능']});}
  else if(R||C||w.alt==='high'){
    const z=R||C; const l=[];
    if(z) l.push(`해당 구역: ${z.code} ${z.name}`,`관할: ${z.auth}`);
    if(w.alt==='high') l.push('고도 150m 이상 비행 → 고도 비행승인 대상');
    cards.push({lv:1,t:'공역 및 비행승인',h:'[필수] 비행승인 신청',l});
  } else cards.push({lv:0,t:'공역 및 비행승인',h:'일반 구역 · 별도 비행승인 불필요',l:['비관제공역, 150m 미만 주간 비행','안전수칙(사람 밀집지역 상공 금지 등) 준수']});
  if(P||R||C||w.alt==='high'){addDoc('초경량비행장치 비행승인 신청서');addDoc('비행계획서');apps.push({n:'비행승인 신청',path:'flight-approval'});}
  // 2. 야간/비가시
  if(w.time==='night'||w.sight==='bvlos'){
    cards.push({lv:2,t:'비행 시간·방식',h:'[필수] 특별비행승인',l:[w.time==='night'?'야간 비행 (일몰 후 ~ 일출 전)':'',w.sight==='bvlos'?'가시권 밖 비행 (BVLOS)':'','안전성인증서 및 비행절차서 첨부 필요'].filter(Boolean)});
    addDoc('특별비행승인 신청서');addDoc('안전성인증서');addDoc('비행절차서(매뉴얼)');apps.push({n:'특별비행승인 신청',path:'special-flight'});
  } else cards.push({lv:0,t:'비행 시간·방식',h:'주간 · 가시권 내 비행',l:['특별비행승인 불필요']});
  // 3. 항공촬영
  if(w.camera){cards.push({lv:1,t:'항공촬영 허가',h:'[필수] 국방부 항공촬영 허가',l:['카메라 탑재 비행','비행 4~7일 전 신청 권장 (관할 군부대 승인)']});addDoc('항공촬영 허가 신청서');apps.push({n:'항공촬영 허가 신청',path:'aerial-photo'});}
  else cards.push({lv:0,t:'항공촬영 허가',h:'해당 없음 (카메라 미탑재)',l:[]});
  // 4. 기체신고/자격
  const needReg = w.wc>=2 || (w.wc===1 && w.purpose==='biz');
  cards.push({lv:0,t:'기체신고 및 조종자격',h:`자격: ${wc.lic}${wc.lic!=='면제'?' ('+wc.licDesc+')':''}`,l:[`최대이륙중량 구간: ${wc.label}`,`기체신고: ${needReg?(w.wc===4?'신고 + 안전성인증 필수':'신고 필수'):'면제'}`],info:true});
  if(needReg){addDoc('초경량비행장치 신고서');apps.push({n:'기체 신고',path:'registration'});}
  if(w.wc===4){addDoc('안전성인증서');}
  if(w.wc>=1)addDoc('조종자격 증명서 (한국교통안전공단 발급)');
  // 5. 사업
  if(w.purpose==='biz'){cards.push({lv:1,t:'사용사업 등록',h:'[필수] 초경량비행장치사용사업 등록',l:['영리 목적 비행 (상업 촬영·방제·측량 등)','영업배상책임보험 가입 필요']});addDoc('초경량비행장치사용사업 등록증');addDoc('영업배상책임보험 가입 증명서');}
  if(docs.length && (P||R||C||w.camera||w.time==='night'||w.sight==='bvlos'))addDoc('드론 기체 제원표 및 기체 사진');
  const level=Math.max(...cards.map(c=>c.lv));
  return {level, cards, docs, apps, zones:zs, input:JSON.parse(JSON.stringify(w)), at:new Date(), no:'DOC-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+String(Math.floor(Math.random()*9000)+1000)};
}

function mapSVG({pin, radius=300, showLabels=true}={}){
  const z=ZONES.filter(z=>S.layers[z.type]).sort((a,b)=>({CONTROL:15,RESTRICTED:20,PROHIBITED:30}[a.type]-{CONTROL:15,RESTRICTED:20,PROHIBITED:30}[b.type]));
  const shapes=z.map(z=>{const s=ZSTYLE[z.type];const a=`class="zone" data-zone="${z.id}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="${s.w}" ${s.dash?`stroke-dasharray="${s.dash}"`:''}`;
    return z.shape==='circle'?`<circle cx="${z.cx}" cy="${z.cy}" r="${z.r}" ${a}/>`:`<polygon points="${z.pts.map(p=>p.join(',')).join(' ')}" ${a}/>`}).join('');
  const zl=showLabels?z.map(z=>{const [x,y]=z.shape==='circle'?[z.cx,z.cy-(z.type==='PROHIBITED'?0:z.r-24)]:[560,150];return `<text x="${x}" y="${y}" text-anchor="middle" font-size="15" font-weight="800" fill="${ZSTYLE[z.type].stroke}" pointer-events="none">${z.code}</text>`}).join(''):'';
  const places=PLACES.map(p=>`<g pointer-events="none"><circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#64748B"/><text x="${p.x+7}" y="${p.y+16}" font-size="12" fill="#475569">${p.name}</text></g>`).join('');
  const pinG=pin?`<g pointer-events="none"><circle cx="${pin.x}" cy="${pin.y}" r="${Math.max(10,radius/20)}" fill="rgba(16,185,129,.25)" stroke="#059669" stroke-width="2"/>
    <path d="M${pin.x} ${pin.y} l-11 -22 a12.5 12.5 0 1 1 22 0 z" fill="#0F172A"/><circle cx="${pin.x}" cy="${pin.y-27}" r="5" fill="#fff"/></g>`:'';
  return `<svg viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" data-map>
    <rect width="1000" height="640" fill="#EEF2EA"/>
    <g fill="#E3EADC"><rect x="40" y="40" width="160" height="110" rx="10"/><rect x="700" y="480" width="200" height="120" rx="10"/><rect x="420" y="40" width="140" height="60" rx="10"/></g>

    <path d="M0,430 C150,380 260,470 400,410 S640,330 790,390 S940,460 1000,420" stroke="#BFDBFE" stroke-width="30" fill="none"/>
    <text x="300" y="456" font-size="13" fill="#60A5FA" font-weight="700">한강</text>
    <g transform="translate(180 250)" pointer-events="none"><rect x="-26" y="-6" width="52" height="12" rx="3" fill="#CBD5E1"/><text y="28" text-anchor="middle" font-size="12" fill="#475569">김포공항</text></g>
    ${shapes}${zl}${places}${pinG}
  </svg>`;
}

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start">
      <div>
        <div class="map" id="wizMap" style="height:260px">${mapSVG({pin:w.place,radius:w.radius,showLabels:true})}</div>
        <p class="cap" style="margin:6px 0 0">📍 지도를 클릭해 핀을 직접 지정할 수 있습니다.</p>

      </div>
    </div>`;

    <div class="row between"><h1 style="font-size:24px">비행 규제 진단</h1><span class="cap">${wizSummary(w)}</span></div>

}

/* ---------- NOTICES & LICENSES ---------- */
function Notices(){
  const isLic=route()==='licenses';
  const tabs=`<div class="tabs"><a href="#/notices" class="${!isLic?'on':''}">드론 공지사항</a><a href="#/licenses" class="${isLic?'on':''}">자격증 가이드</a></div>`;
  if(!isLic){
    const cats=['전체','공역고시','법령개정','단속','일반'];
    const list=NOTICES.map((n,i)=>({...n,i})).filter(n=>(S.ntcCat==='전체'||n.cat===S.ntcCat)&&(!S.ntcQ||(n.title+n.body).includes(S.ntcQ)));
    return `<div class="wrap" style="max-width:900px">${tabs}
      <form class="row" data-form="ntc" style="margin:18px 0 10px;flex-wrap:nowrap"><input class="field" name="q" value="${S.ntcQ}" placeholder="검색어 입력: 관제권, 단속 등"><button class="btn">검색</button></form>
      <div class="chips" style="margin-bottom:16px">${cats.map(c=>`<button class="chip ${S.ntcCat===c?'on':''}" data-act="ntc-cat" data-c="${c}">${c}</button>`).join('')}</div>
      <div class="grid" style="gap:12px">${list.length?list.map(n=>`<article class="ntc">
        <button class="ntc-h" data-act="ntc-toggle" data-i="${n.i}"><span class="badge b-gray">${n.cat}</span><h3>${n.title}</h3><div class="row between"><span class="cap">${n.org} · ${n.date} · 조회 ${n.views}</span><span class="cap" style="color:var(--sky);font-weight:600">${S.ntcOpen===n.i?'접기 ▲':'모바일 최적화 본문 ▼'}</span></div></button>
        ${S.ntcOpen===n.i?`<div class="ntc-b">${n.body}<div class="row between" style="margin-top:12px"><button class="btn sm" data-act="toast" data-m="첨부파일 다운로드 (목업)">📎 첨부파일</button><button class="btn sm" data-act="onestop" data-n="원문 공지" data-p="notice">드론원스톱 원문 보기 ↗</button></div></div>`:''}
      </article>`).join(''):'<div class="card muted">검색된 공지사항이 없습니다.</div>'}</div>
    </div>`;

document.addEventListener('click',e=>{
  // map click (pin / polygon)
  const svg=e.target.closest('svg[data-map]');
  if(svg){
    const p=svgPoint(e); const zEl=e.target.closest('.zone'); const r=route();
    if(r==='diagnosis'){S.wiz.place={name:'지도 지정 위치',addr:`좌표 (${p.x}, ${p.y})`,x:p.x,y:p.y};render();return}
    if(zEl){S.popup={id:zEl.dataset.zone,x:p.x,y:p.y}}else S.popup=null;
    if(r==='map'&&!zEl){S.mapPin={x:p.x,y:p.y,name:'지도 지정 위치'}}
    render();return;
  }
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, w=S.wiz;
  switch(a){
    case 'layer-close': if(e.target===el)closeLayer(); return;
    case 'layer-x': closeLayer(); break;
    case 'wiz-new': S.wiz=newWiz({droneId:S.user&&S.drones[0]?.id||null,...(S.drones[0]&&S.user?{wc:wcOf(S.drones[0].mtow),camera:S.drones[0].camera}:{})}); break;
    case 'wiz-drone': {const d=droneById(el.dataset.id);w.droneId=d?d.id:null;if(d){w.wc=wcOf(d.mtow);w.camera=d.camera;toast(`${d.model} 제원을 불러왔습니다`)}render();break}
    case 'wiz-set': {const k=el.dataset.k;let v=el.dataset.v;if(k==='wc')v=+v,w.droneId=null;if(k==='camera')v=v==='1';w[k]=v;render();break}
    case 'wiz-place': w.place={...PLACES[+el.dataset.i]};w.qErr='';render();break;
    case 'wiz-next': w.step++;render();scrollTo(0,0);break;
    case 'wiz-prev': w.step--;render();break;
    case 'wiz-reset': S.wiz=newWiz();render();break;
    case 'wiz-submit': goDiagnose();break;
    case 'layer': {const k=el.dataset.k;if(k==='ALL'){const all=Object.values(S.layers).every(Boolean);Object.keys(S.layers).forEach(x=>S.layers[x]=!all)}else S.layers[k]=!S.layers[k];render();break}
    case 'pop-close': S.popup=null;render();break;
    case 'zoom': toast('지도 축척 조절 (목업)');break;
    case 'pdf': openPDF(S.result);break;
    case 'print': window.print();break;
    case 'onestop': toast(`↗ 드론원스톱 '${el.dataset.n}' 페이지로 이동 (프로토타입)`);break;
    case 'map-diag': S.wiz=newWiz({step:1,place:{...S.mapPin,addr:''}});location.hash='#/diagnosis';toast('위치가 입력되었습니다. 기체 정보를 선택하세요');break;
    case 'ntc-toggle': {const i=+el.dataset.i;S.ntcOpen=S.ntcOpen===i?-1:i;render();break}
    case 'ntc-go': S.ntcOpen=+el.dataset.i;break;
    case 'ntc-cat': S.ntcCat=el.dataset.c;render();break;
    case 'toast': e.preventDefault();toast(el.dataset.m);break;
    case 'drone-edit': droneForm(droneById(el.dataset.id));break;
    case 'drone-del': {const d=droneById(el.dataset.id);if(confirm(`'${d.name}' 기체를 삭제할까요?`)){S.drones=S.drones.filter(x=>x!==d);render();toast('삭제되었습니다')}break}
    case 'drone-diag': {const d=droneById(el.dataset.id);S.wiz=newWiz({droneId:d.id,wc:wcOf(d.mtow),camera:d.camera});location.hash='#/diagnosis';break}
    case 'hist-pdf': openPDF(S.history[+el.dataset.i]);break;
    case 'hist-view': S.result=S.history[+el.dataset.i];S.popup=null;location.hash='#/result';break;
    case 'hist-redo': S.wiz=newWiz({...S.history[+el.dataset.i].input,step:3});location.hash='#/diagnosis';toast('이전 조건을 불러왔습니다');break;
    case 'logout': S.user=null;location.hash='#/home';render();toast('로그아웃되었습니다');break;
    case 'auth-toggle': e.preventDefault();signup=!signup;render();break;
    case 'chat-open': chatOpen();break;
    case 'chat-close': $('#drawer').classList.remove('open');break;
    case 'chat-q': ask(el.dataset.q);break;
  }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.change;if(!k)return;
  if(k==='radius'){S.wiz.radius=+e.target.value}
  if(k==='histFilter'){S.histFilter=e.target.value}
  render();
});
document.addEventListener('submit',e=>{
  const f=e.target; const kind=f.dataset.form; if(!kind)return; e.preventDefault();
  const fd=new FormData(f);
  if(kind==='quick'){const q=(fd.get('q')||'').trim();const p=PLACES.find(p=>q&&(p.name.includes(q)||p.addr.includes(q)||q.includes(p.name.split(' ')[0])));
    if(!q){location.hash='#/map';return}
    if(p){S.mapPin={...p};S.popup=null;location.hash='#/map'}else toast('검색된 주소가 없습니다. 지도 위를 직접 클릭해 핀을 지정해주세요.');}
  if(kind==='wiz-search'){const q=(fd.get('q')||'').trim();S.wiz.q=q;const p=PLACES.find(p=>q&&(p.name.includes(q)||p.addr.includes(q)||p.name.includes(q.replace(/\s/g,''))||q.split(' ').some(t=>t.length>1&&(p.name+p.addr).includes(t))));
    if(p){S.wiz.place={...p};S.wiz.qErr=''}else S.wiz.qErr='검색된 주소가 없습니다. 도로명 또는 지번 주소를 확인하거나 지도 위를 직접 클릭해 핀을 지정해주세요.';render();}
  if(kind==='ntc'){S.ntcQ=(fd.get('q')||'').trim();render()}
  if(kind==='login'){const email=fd.get('email'),pw=fd.get('pw'),name=fd.get('name');
    if(!/^\S+@\S+\.\S+$/.test(email)||!pw||(signup&&!name)){$('#loginErr').innerHTML='<div class="err">이메일 형식과 필수 입력값을 확인해주세요.</div>';return}
    S.user={name:signup?name:'김태홍',email};signup=false;location.hash='#/mypage';toast('로그인되었습니다');}
  if(kind==='drone'){const id=f.dataset.id;const d={id:id||'d'+Date.now(),name:fd.get('name'),model:fd.get('model'),empty:+fd.get('empty'),mtow:+fd.get('mtow'),camera:!!fd.get('camera'),reg:fd.get('reg')};
    if(!d.name||!d.model||!d.mtow){toast('필수 항목을 입력해주세요');return}
    if(id)S.drones=S.drones.map(x=>x.id===id?d:x);else S.drones.push(d);closeLayer();render();toast(id?'수정되었습니다':'새 드론이 등록되었습니다');}
});
$('#chatForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatInput');ask(i.value);i.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLayer();$('#drawer').classList.remove('open')}});
window.addEventListener('hashchange',()=>{S.popup=null;render();scrollTo(0,0)});
render();
</script>
</body>
</html>
